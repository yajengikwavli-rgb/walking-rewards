<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walk & Earn</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Menu Button -->
    <button class="menu-button" onclick="toggleMenu()">☰</button>

    <!-- Side Menu -->
    <div id="sideMenu" class="side-menu">
        <div class="menu-header">
            <h2>☰ Walk & Earn</h2>
            <button class="close-button" onclick="toggleMenu()">×</button>
        </div>

        <div class="menu-profile">
            <div class="profile-icon">👤</div>
            <div>
                <h3>Gabrielle</h3>
                <p>Walk & Earn Member</p>
            </div>
        </div>

        <div class="menu-items">
            <button onclick="showSection('wallet')">💰 Wallet</button>
            <button onclick="showSection('rewards')">🎁 Rewards</button>
            <button onclick="showSection('history')">📜 History</button>

            <hr>

            <button onclick="showSection('strength')">💪 Strength</button>
            <button onclick="showSection('core')">🧘 Core</button>
            <button onclick="showSection('streaks')">🔥 Streaks</button>

            <hr>

            <button onclick="showSection('million')">🎯 1,000,000 Steps</button>
            <button onclick="showSection('calories')">🔥 Calories Burned</button>
            <button onclick="showSection('stats')">📊 Statistics</button>
            <button onclick="showSection('achievements')">🏆 Achievements</button>
        </div>
    </div>

    <!-- Main App -->
    <div class="app">

        <h1>🚶 Walk & Earn</h1>
        <p class="subtitle">Turn your steps into rewards!</p>

        <div class="quote-card">
            <p>💬 Quote of the Day</p>
            <h3 id="dailyQuote">Loading...</h3>
        </div>

        <div class="card">
            <p>Today's Steps</p>
            <h2 id="steps">0</h2>
            <button onclick="addSteps()">＋ Add Steps</button>
        </div>

        <div class="card">
            <p>Your Points</p>
            <h2 id="points">0</h2>
            <p>1 point = 200 steps</p>
        </div>

        <div class="card">
            <p>Progress to My Goal</p>
            <div class="progress-bar">
                <div id="progress"></div>
            </div>
            <p id="progressText">0 / 8,000 steps</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
